# Final site, after Certbot issues the nodusnetwork.io certificate.
server {
    listen 80;
    listen [::]:80;
    server_name nodusnetwork.io www.nodusnetwork.io;
    root /var/www/nodusnetwork.io/public;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://nodusnetwork.io$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nodusnetwork.io;
    ssl_certificate /etc/letsencrypt/live/nodusnetwork.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodusnetwork.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://nodusnetwork.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nodusnetwork.io;
    root /var/www/nodusnetwork.io/public;
    index index.html;
    autoindex off;
    ssl_certificate /etc/letsencrypt/live/nodusnetwork.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodusnetwork.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=0, must-revalidate, no-transform" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location ~ /\. { return 404; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
