# HTTP bootstrap draft; install only after deployment approval.
limit_req_zone $binary_remote_addr zone=nodus_scan_api:10m rate=10r/s;
map $uri $nodus_scan_cache_control {
    default "public, max-age=0, must-revalidate, no-transform";
    ~^/api/ "no-store";
}
server {
    listen 80;
    listen [::]:80;
    server_name scan.nodusnetwork.io;
    root /var/www/scan.nodusnetwork.io/public;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $nodus_scan_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=nodus_scan_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8390;
        proxy_read_timeout 10s;
    }
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
