# HTTP bootstrap draft; install only after deployment approval.
server {
    listen 80;
    listen [::]:80;
    server_name wiki.nodusnetwork.io;
    root /var/www/wiki.nodusnetwork.io/public;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=0, must-revalidate, no-transform" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
