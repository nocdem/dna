# Web server in front of the swap bot, installed on the bot's machine, 62.171.136.77 (plan
# docs/plans/2026-11-08-swap-bot-plan.nodus1.md section 4.1 "The web server in front of the bot on 62.171.136.77" and
# section 18 change 5; operator, givens items 100-102, 105, 107). The page swap.nodusnetwork.io stays on EU-6
# (swap-https.conf); the browser and the extension reach the bot here, directly, at https://62.171.136.77.
# This is ONE file for /etc/nginx/sites-available/amm-62.171.136.77 (enabled by a symlink in sites-enabled, which nginx
# includes inside its http context: the limit_req_zone line below must sit in the http context, and does).
# kayraninyeri.com's own server blocks and certificate are not touched by this file. The one change to that site's
# behaviour: an https request to the bare IP address now reaches the bot's block (this block is the default for
# IPv4 port 443) and gets 404 for anything but /amm/ (section 4.1, first bullet).
# Run `nginx -t` before EVERY reload and keep a backup of /etc/nginx first: this nginx also serves kayraninyeri.com.
#
# What each block does (section 4.1 server-block bullets; every directive's behaviour read in the pinned nginx 1.22.1,
# /home/nocdem/refs/nginx-release-1.22.1/src/http):
#  1. limit_req_zone: one zone for both price-question paths, 30 requests a minute per client address (the
#     connection's own address, no forwarded header: nothing sits in front of this IP). 30r/m is stored as 500
#     (30 * 1000 / 60, modules/ngx_http_limit_req_module.c:912-913, :939) and a request is refused when less than 2000 ms
#     passed since the last accepted one of the same address and no burst is named (:454-462 with burst 0); a refused
#     request does not move that time (:466-471). That is givens item 102: one price question every 2 seconds per
#     address, no burst.
#  2. Port 80 server: only /.well-known/acme-challenge/ (the ACME client writes the challenge file under
#     /var/www/acme-amm), 404 for everything else, no default_server: nginx finds this block by the Host value, an exact
#     name lookup (ngx_http_request.c:2300-2316), and Let's Encrypt validates an IP address with the IP as Host
#     (RFC 8738 section 5, plan section 4.1), so every other port-80 request still reaches kayra's implicit default block.
#  3. Port 443 server, the default for IPv4 443: a browser connecting to an IP address sends no server name, and a
#     handshake without one keeps the default server of the address:port (ngx_http_request.c:304-305, :872-878), so the
#     bot's certificate must be the default's. kayraninyeri.com keeps its block through the name the browser sends.
#     `listen 62.171.136.77:443 ssl default_server;` (PROPOSAL, chosen over `listen 443 ssl default_server;`: the
#     specific address makes this block the default only for the address the certificate names, leaves kayra's
#     wildcard 443 listener the default for every other address of the host, and cannot collide with a
#     `default_server` of the wildcard listener; it needs that address on one of the machine's interfaces, to be
#     read with `ip -4 addr` at the install). IPv4 only: no [::] listen, as the certificate and the page name only
#     the IPv4 address.
#     Certificate files: lego's default output names under `--path /etc/lego-amm`: <path>/certificates/<name>.crt
#     (certificate bundle: leaf then issuer, since --no-bundle is off by default) and <name>.key, where <name> is the
#     first --domains value with only letters, digits, - _ . @ kept (lego v5.6.0
#     cmd/internal/storage/storage_certificates.go:20-22 extensions, :29 folder "certificates", :66-83 SanitizedName;
#     storage_certificates_reader.go:64-65 file name = root path + SanitizedName(certID) + extension;
#     certificate/certificates.go:309 and :386 certificate ID = domains[0]; cmd/cmd_run.go with --path from
#     cmd/internal/flags/names.go:61), so for `--domains 62.171.136.77` the files are
#     /etc/lego-amm/certificates/62.171.136.77.crt and .key.
#  4. Only `location /amm/` is proxied to the bot at 127.0.0.1:4011 (the installed http_port; the bot listens on
#     127.0.0.1 only). Every other path: 404. Methods GET, POST, OPTIONS; any other: 405 (checked by `if` in the
#     rewrite phase, where only `return` and `add_header` are used). Body at most 16 KiB (the bot's http_max_body is
#     16384). nginx reads the whole request body before it connects to the bot (proxy_request_buffering is on by
#     default, modules/ngx_http_proxy_module.c:3478-3479), so a slow client never holds one of the bot's connections.
#     proxy_pass_request_headers off: the bot reads only Content-Length and Transfer-Encoding (amm_http.c:76-104), and
#     nginx still sends its own header set, Content-Length included (ngx_http_proxy_headers,
#     ngx_http_proxy_module.c:820-830), so a long browser header cannot make the bot answer 431. Proxy timeouts per
#     section 4.1: connect 5 s and send 5 s, read 10 s (the defaults are 60 s each,
#     ngx_http_proxy_module.c:3491-3500): above the bot's http_timeout_ms of 5000 and below the page's 15 s abort
#     (website/swap-site/bot.js timeoutMs), so a stuck bot gives a 504 that still carries the allow-origin header.
#  5. Cross-origin answers: every answer carries `Access-Control-Allow-Origin: https://swap.nodusnetwork.io`, one fixed
#     value (never * and never the request's Origin echoed), because the browser fails any response whose header does
#     not equal the page's origin, whatever the status (whatwg Fetch, plan section 4.1). add_header without `always`
#     adds only on 200, 201, 204, 206, 301, 302, 303, 304, 307 and 308
#     (modules/ngx_http_headers_filter_module.c:186-200, :216), so every add_header here has `always`. A level that
#     has an add_header of its own inherits none from above (ngx_http_headers_filter_module.c:696-697), so the OPTIONS
#     `if` blocks and the 429 named location repeat the allow-origin header; the server level carries it for
#     everything else (404, 405, 413, 502, 504 and the proxied answers).
#  6. OPTIONS is answered 204 by nginx itself in the rewrite phase (`return 204`, modules/ngx_http_rewrite_module.c:
#     279-286, registered in NGX_HTTP_REWRITE_PHASE), before the preaccess phase where limit_req runs
#     (ngx_http_core_module.h:108-118; ngx_http_limit_req_module.c:1094), so an OPTIONS never reaches the bot and never
#     uses the allowance. Access-Control-Max-Age 600 s is a PROPOSAL (no operator value; the browser caps it).
#  7. limit_req applies only on `location = /amm/quote` and `location = /amm/liquidity/quote`, with no burst. A refused
#     request is answered 429 (`limit_req_status 429`, modules/ngx_http_limit_req_module.c:127-132; the default is 503)
#     and `error_page 429 = @amm_busy` returns the bot's own refusal shape {"approved":false,"reason":"busy"} so the
#     page shows "busy" and not "could not be reached". `return 429 <text>` sends the text directly, without going
#     through error_page again (ngx_http_script.c:1494-1498), and its Content-Type is the location's default_type
#     (ngx_http_core_module.c:1750-1790).
#
# Install steps and the certificate command: website/deploy/README.md, section "Swap bot on 62.171.136.77".

limit_req_zone $binary_remote_addr zone=amm_quote:1m rate=30r/m;

server {
    listen 80;
    server_name 62.171.136.77;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-amm;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}

server {
    listen 62.171.136.77:443 ssl default_server;
    server_name 62.171.136.77;
    ssl_certificate /etc/lego-amm/certificates/62.171.136.77.crt;
    ssl_certificate_key /etc/lego-amm/certificates/62.171.136.77.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    limit_req_status 429;
    error_page 429 = @amm_busy;
    add_header Access-Control-Allow-Origin "https://swap.nodusnetwork.io" always;

    # The two price-question paths: one allowance per client address, no burst.
    location = /amm/quote {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://swap.nodusnetwork.io" always;
            add_header Access-Control-Allow-Methods "GET, POST" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        limit_req zone=amm_quote nodelay;
        proxy_pass http://127.0.0.1:4011;
        proxy_pass_request_headers off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }
    location = /amm/liquidity/quote {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://swap.nodusnetwork.io" always;
            add_header Access-Control-Allow-Methods "GET, POST" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        limit_req zone=amm_quote nodelay;
        proxy_pass http://127.0.0.1:4011;
        proxy_pass_request_headers off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Every other bot route (status, swap state, signed requests, withdrawals): no allowance counted.
    location /amm/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://swap.nodusnetwork.io" always;
            add_header Access-Control-Allow-Methods "GET, POST" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_pass http://127.0.0.1:4011;
        proxy_pass_request_headers off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }

    location @amm_busy {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://swap.nodusnetwork.io" always;
        return 429 '{"approved":false,"reason":"busy"}';
    }

    location / { return 404; }
}
