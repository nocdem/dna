[package]
name = "plonky3_oracle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "DNAC-ZK Plonky3 reference oracle — emits test vectors for C primitives to byte-match against."
publish = false

# Plonky3 dependencies pinned to commit 11cc5849 = tag v0.6.2 (2026-07-20).
# PREVIOUS PIN: 82cfad73 (2026-05-20) — an untagged main commit between v0.5.3
# and v0.6.0. Bumped 2026-07-26 (B2/S1) because Plonky3-recursion — the
# reference for the P2 verifier-in-circuit work — requires the 0.6 line.
# This bump is NOT cosmetic: DuplexChallenger::duplexing() became prefix-free
# upstream (clears unused rate slots + binds the absorbed length into
# sponge_state[RATE]), which moves every Fiat-Shamir challenge and therefore
# every proof-bearing vector. Full delta measurement + the 52-vector risk
# classification: tasks/orchestration.md FLEET 005.
# DO NOT bump without a design-doc revision and full test-vector re-validation.
[dependencies]
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-air = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-util = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
# Direct deps added in Phase T1 (transcript oracle). Already transitively
# pulled via p3-fri; declared here to be importable. Same commit pin.
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
# Added Stage M1 (merkle/mmcs oracle, 2026-05-27). Same commit pin.
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
# Added P2 (stark-priming oracle, 2026-05-30) — real p3_uni_stark::prove over a
# vendored FibonacciAir. Same commit pin. Default features (no `parallel`); pow=0
# in the FRI params keeps `prove` grind-free and byte-deterministic.
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
# FP1c.2 — poseidon2-air trace generation oracle. Same commit pin. Provides
# generate_trace_rows + RoundConstants for the Poseidon2Cols<8,7,1,4,22> layout.
p3-poseidon2-air = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
# B1 Stage-2 (2026-07-15) — GenericPoseidon2LinearLayers trait, needed by the
# VERBATIM-vendored poseidon2-air eval (air.rs:144-323; pub(crate) upstream) used
# inside the combined ConfRootAir. Already in Cargo.lock transitively via
# p3-poseidon2-air; declared to be importable. Same commit pin.
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
# P2L-a (2026-07-23) — LogUp gadget oracle (dump-logup). The REAL
# p3_lookup::logup::LogUpGadget (lookup/src/logup.rs) generates the aux
# (permutation) traces + constraint residuals the C logup.c byte-matches.
# Same commit pin.
p3-lookup = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }
# P2L-b (2026-07-23) — interaction/bus oracle (dump-logup-bus). The REAL
# BatchTranscript::sample_perm_challenges (batch-stark/src/transcript.rs:74-102)
# provides the per-bus challenge-memo ground truth the C logup_bus.c matches.
# Same commit pin.
p3-batch-stark = { git = "https://github.com/Plonky3/Plonky3", rev = "11cc5849a1b57a2f520d6edc608b9e516517d841" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

# is_zk=1 (hiding) prover path — M1 sandbox confidential milestone (2026-07-13).
# SmallRng seeds the MerkleTreeHidingMmcs leaf-salt + HidingFriPcs random
# codewords. rand 0.10.1 is ALREADY in Cargo.lock (transitive via
# p3-merkle-tree); this only makes it directly importable. default-features
# = false matches the Plonky3 workspace pin (Cargo.toml:80). Determinism:
# seed_from_u64(1) gives a byte-stable KAT (the C verifier never sees the
# seed; real proving would use OS entropy).
rand = { version = "0.10.0", default-features = false, features = ["alloc"] }

# SHA3-512 for Merkle / transcript / commitment hashing. The `sha3` crate
# implements FIPS-202 verbatim — same standard DNAC's crypto/hash/qgp_sha3.c
# wraps via OpenSSL. Cross-validation gate: both implementations are FIPS-202
# compliant, so a byte-identity check is meaningful.
sha3 = "0.10"

[profile.release]
# Determinism flags. lto=fat for stable layout; codegen-units=1 to avoid
# parallel codegen non-determinism.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
# B1 Stage-2 (2026-07-15, grounding GAP4): keep debug_assert guards ACTIVE in the
# oracle. uni-stark/src/symbolic.rs:24-31 validates a max_constraint_degree hint
# with debug_assert only — a plain --release oracle would silently skip the
# degree-hint guard. debug-assertions add checks only (no output-value change);
# vector regeneration stays byte-identical.
debug-assertions = true

# Aggressive reproducibility: pin the dep graph fully at build time.
# Cargo.lock will be committed once first build succeeds on a Rust-equipped host.
